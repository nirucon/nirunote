[package]
name = "nirunote"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Fast, light Markdown editor of the NIRU suite, with a styled preview"

[dependencies]
x11rb = { version = "0.13", features = ["shm"] }
ab_glyph = "0.2"
resvg = { version = "0.45", default-features = false }
png = "0.17"
zune-jpeg = "0.4"
gif = "0.13"
image-webp = "0.2"
fancy-regex = "0.14"
serde_json = "1"
toml = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
