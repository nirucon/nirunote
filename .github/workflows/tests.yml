name: Python checks
on: [push, pull_request]
jobs:
  syntax-and-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install PySide6
        run: python -m pip install PySide6
      - name: Python syntax
        run: python -m compileall -q nirunote gui-smoke-test.py
      - name: Core tests
        run: QT_QPA_PLATFORM=offscreen python nirunote/app.py --core-self-test
      - name: GUI smoke test
        run: QT_QPA_PLATFORM=offscreen python gui-smoke-test.py
      - name: Release preflight
        run: python scripts/release-check.py
