name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - name: Install musl and X11 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools xvfb xdotool x11-utils xclip fontconfig fonts-dejavu-core python3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify release identity and a static binary
        run: |
          B=target/x86_64-unknown-linux-musl/release/nirunote
          test "$($B --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
          if ldd $B 2>&1 | grep -q '=>'; then echo "::error::nirunote is dynamically linked"; exit 1; fi
          $B --core-self-test
          sh tests/xvfb.sh $B
      - name: Collect assets
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/nirunote assets/nirunote.desktop assets/nirunote.svg dist/
          cd dist && sha256sum nirunote nirunote.desktop nirunote.svg > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/nirunote
            dist/nirunote.desktop
            dist/nirunote.svg
            dist/SHA256SUMS
          generate_release_notes: true
